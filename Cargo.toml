[workspace]
resolver = "2"
members = ["crates/*"]
exclude = ["prototype"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
async-channel = "2"
gpui-kit = "0.9.0"
portable-pty = "0.9"
wezterm-term = { git = "https://github.com/wez/wezterm", rev = "e68a8ec27727fbbda15e07f0a0737cd5e16481f6", package = "wezterm-term" }

[patch.crates-io]
pathfinder_simd = { path = "vendor/pathfinder_simd" }
